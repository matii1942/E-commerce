<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito — ZapasDep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="barra">
        <div class="barra-fila">
            <a class="logo" href="index.html">Zapas<span>Dep</span></a>

            <form class="buscador" role="search" onsubmit="return false">
                <input type="search" placeholder="Buscar zapatillas, remeras, gorras..."
                       aria-label="Buscar productos" autocomplete="off"
                       onfocus="location.href='index.html'">
                <button type="submit" aria-label="Buscar"><i class="bi bi-search"></i></button>
            </form>

            <nav class="acciones">
                <span id="sesion"></span>
                <a class="accion-carrito activa" href="carrito.html" aria-label="Ver el carrito">
                    <i class="bi bi-cart3"></i>
                    <span id="numero" class="numero">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="pagina">
        <div class="pagina-cabecera">
            <h1 class="titulo-principal">Tu carrito</h1>
        </div>

        <p id="carrito-aviso" class="carrito-aviso disabled"></p>

        <p id="carrito-vacio" class="estado-vacio">
            <i class="bi bi-cart-x"></i>
            Tu carrito está vacío.
            <a href="index.html">Ver productos</a>
        </p>

        <div class="carrito-columnas">
            <div id="carrito-productos" class="carrito-productos disabled"></div>

            <aside id="carrito-acciones" class="carrito-acciones disabled">
                <h2>Resumen</h2>
                <div class="carrito-acciones-total">
                    <span>Total</span>
                    <strong id="total">$0</strong>
                </div>
                <button id="carrito-acciones-comprar" class="carrito-acciones-comprar">Comprar ahora</button>
                <button id="carrito-acciones-vaciar" class="carrito-acciones-vaciar">Vaciar carrito</button>
            </aside>
        </div>

        <p id="carrito-comprado" class="estado-ok disabled">
            <i class="bi bi-bag-check"></i>
            Gracias por tu compra.
        </p>
    </main>

    <footer class="pie">
        <p>© 2025 ZapasDep — proyecto de demostración, no es una tienda real.</p>
    </footer>

    <script src="js/formato.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/carrito-guardado.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
