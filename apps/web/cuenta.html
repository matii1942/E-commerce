<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta — ZapasDep</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header class="barra">
        <div class="barra-fila">
            <a class="logo" href="index.html">Zapas<span>Dep</span></a>

            <form class="buscador" role="search" onsubmit="return false">
                <input type="search" placeholder="Buscar zapatillas, remeras, gorras..."
                       aria-label="Buscar productos" autocomplete="off"
                       onfocus="location.href='index.html'">
                <button type="submit" aria-label="Buscar"><i class="bi bi-search"></i></button>
            </form>

            <nav class="acciones">
                <span id="sesion"></span>
                <a class="accion-carrito" href="carrito.html" aria-label="Ver el carrito">
                    <i class="bi bi-cart3"></i>
                    <span id="numero" class="numero">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="pagina">
        <div class="pagina-cabecera">
            <h1 class="titulo-principal">Mi cuenta</h1>
        </div>

            <p id="cuenta-mensaje" class="cuenta-mensaje disabled"></p>

            <div class="cuenta-paneles">
                <section class="cuenta-panel">
                    <h3>Entrar</h3>
                    <form id="form-login" novalidate>
                        <label for="login-email">Correo</label>
                        <input id="login-email" name="email" type="email" autocomplete="email" required>

                        <label for="login-password">Contraseña</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required>

                        <button type="submit">Entrar</button>
                    </form>
                </section>

                <section class="cuenta-panel">
                    <h3>Crear una cuenta</h3>
                    <form id="form-registro" novalidate>
                        <label for="registro-nombre">Nombre</label>
                        <input id="registro-nombre" name="nombre" type="text" required>

                        <label for="registro-apellido">Apellido</label>
                        <input id="registro-apellido" name="apellido" type="text" required>

                        <label for="registro-edad">Edad</label>
                        <input id="registro-edad" name="edad" type="number" min="1" max="120" required>

                        <!--
                            `carrera` es obligatorio en el modelo de usuario, que viene
                            de un ejercicio de facultad. En una tienda de zapatillas no
                            tiene sentido pedirlo; se pide porque sin el la API rechaza
                            el alta. Esta anotado en el README para sacarlo.
                        -->
                        <label for="registro-carrera">Carrera</label>
                        <input id="registro-carrera" name="carrera" type="text" required>

                        <label for="registro-email">Correo</label>
                        <input id="registro-email" name="email" type="email" autocomplete="email" required>

                        <label for="registro-password">Contraseña</label>
                        <input id="registro-password" name="password" type="password" autocomplete="new-password" required>
                        <small class="cuenta-ayuda">
                            Entre 6 y 12 caracteres, con al menos un numero, una minuscula y una mayuscula.
                        </small>

                        <button type="submit">Crear cuenta</button>
                    </form>
                </section>
        </div>
    </main>

    <footer class="pie">
        <p>© 2025 ZapasDep — proyecto de demostración, no es una tienda real.</p>
    </footer>

    <script src="js/sesion.js"></script>
    <script src="js/carrito-guardado.js"></script>
    <script src="js/cuenta.js"></script>
</body>
</html>
