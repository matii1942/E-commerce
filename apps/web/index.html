<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapasDep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!--
        La barra superior se repite igual en las tres paginas. Es markup
        duplicado a proposito: sin un motor de plantillas, un include del lado
        del cliente parpadearia en cada carga y ataria el encabezado a que el
        JavaScript corra. Tres copias de veinte lineas es el precio.
    -->
    <header class="barra">
        <div class="barra-fila">
            <a class="logo" href="index.html">Zapas<span>Dep</span></a>

            <form class="buscador" role="search" onsubmit="return false">
                <input id="buscador" type="search" placeholder="Buscar zapatillas, remeras, gorras..."
                       aria-label="Buscar productos" autocomplete="off">
                <button type="submit" aria-label="Buscar"><i class="bi bi-search"></i></button>
            </form>

            <nav class="acciones">
                <span id="sesion"></span>
                <a class="accion-carrito" href="carrito.html" aria-label="Ver el carrito">
                    <i class="bi bi-cart3"></i>
                    <span id="numero" class="numero">0</span>
                </a>
            </nav>
        </div>

        <nav class="categorias" aria-label="Categorías">
            <button id="todos" class="button-categoria active">Todos los productos</button>
            <button id="zapatillas" class="button-categoria">Zapatillas</button>
            <button id="remeras" class="button-categoria">Remeras</button>
            <button id="gorras" class="button-categoria">Gorras</button>
        </nav>
    </header>

    <main class="pagina">
        <div class="pagina-cabecera">
            <h1 class="titulo-principal" id="titulo-principal">Todos los productos</h1>
            <p class="resultado-conteo" id="resultado-conteo"></p>
        </div>

        <div id="contenedor-productos" class="grilla"></div>
    </main>

    <footer class="pie">
        <p>© 2025 ZapasDep — proyecto de demostración, no es una tienda real.</p>
    </footer>

    <script src="js/formato.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/carrito-guardado.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
