<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta — ZapasDep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">ZapasDep</h1>
            </header>
            <nav>
                <ul>
                    <li>
                        <a class="button-categoria" href="index.html">
                            <i class="bi bi-arrow-counterclockwise"></i>Seguir comprando
                        </a>
                    </li>
                    <li>
                        <a class="button-categoria" href="carrito.html">
                            <i class="bi bi-handbag"></i>Carrito
                        </a>
                    </li>
                    <li id="sesion"></li>
                </ul>
            </nav>
            <footer>
                <p>© 2025 ZapasDep. Todos los derechos reservados.</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal">Mi cuenta</h2>

            <p id="cuenta-mensaje" class="cuenta-mensaje disabled"></p>

            <div class="cuenta-paneles">
                <section class="card cuenta-panel">
                    <h3>Entrar</h3>
                    <form id="form-login" novalidate>
                        <label for="login-email">Correo</label>
                        <input id="login-email" name="email" type="email" autocomplete="email" required>

                        <label for="login-password">Contraseña</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required>

                        <button type="submit">Entrar</button>
                    </form>
                </section>

                <section class="card cuenta-panel">
                    <h3>Crear una cuenta</h3>
                    <form id="form-registro" novalidate>
                        <label for="registro-nombre">Nombre</label>
                        <input id="registro-nombre" name="nombre" type="text" required>

                        <label for="registro-apellido">Apellido</label>
                        <input id="registro-apellido" name="apellido" type="text" required>

                        <label for="registro-edad">Edad</label>
                        <input id="registro-edad" name="edad" type="number" min="1" max="120" required>

                        <!--
                            `carrera` es obligatorio en el modelo de usuario, que viene
                            de un ejercicio de facultad. En una tienda de zapatillas no
                            tiene sentido pedirlo; se pide porque sin el la API rechaza
                            el alta. Esta anotado en el README para sacarlo.
                        -->
                        <label for="registro-carrera">Carrera</label>
                        <input id="registro-carrera" name="carrera" type="text" required>

                        <label for="registro-email">Correo</label>
                        <input id="registro-email" name="email" type="email" autocomplete="email" required>

                        <label for="registro-password">Contraseña</label>
                        <input id="registro-password" name="password" type="password" autocomplete="new-password" required>
                        <small class="cuenta-ayuda">
                            Entre 6 y 12 caracteres, con al menos un numero, una minuscula y una mayuscula.
                        </small>

                        <button type="submit">Crear cuenta</button>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script src="js/sesion.js"></script>
    <script src="js/cuenta.js"></script>
</body>
</html>
